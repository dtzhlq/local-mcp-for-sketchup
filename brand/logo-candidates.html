<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Logo 候选 A/B — SketchUp 形体融合</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Helvetica Neue","PingFang SC",sans-serif;background:#fff;color:#111;padding:48px}
  h1{font-size:24px;margin-bottom:6px}
  .sub{color:#6E6E6E;font-size:14px;margin-bottom:36px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:1000px}
  .cand{border:1px solid #E5E5E5}
  .cand .tag{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #E5E5E5}
  .tag b{font-size:16px}.tag span{font-size:12px;color:#6E6E6E}
  .row{display:flex;border-bottom:1px solid #E5E5E5}
  .cell{flex:1;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .cell.light{background:#fff}.cell.dark{background:#141414;border-left:1px solid #E5E5E5}
  .cell img{width:70%;object-fit:contain}
  .sizes{display:flex;align-items:flex-end;gap:28px;padding:20px 18px}
  .sizes div{text-align:center;font-size:10px;color:#6E6E6E}
  .note{margin-top:28px;font-size:13px;color:#6E6E6E;max-width:1000px}
  .note b{color:#002FA7}
</style>
</head>
<body>
<h1>Logo 候选 A/B — SketchUp 形体融合</h1>
<p class="sub">借用等轴测六边形剪影 + 折叠角带语言，保留 IKB 蓝 + 顶点星火。2026-07-28</p>
<div class="grid">
  <div class="cand">
    <div class="tag"><b>A · 折叠角带立方体</b><span>logo-concept-ribbon.png</span></div>
    <div class="row">
      <div class="cell light"><img src="logo-concept-ribbon.png"></div>
      <div class="cell dark"><img src="logo-concept-ribbon.png"></div>
    </div>
    <div class="sizes">
      <div><img src="logo-concept-ribbon.png" width="64"></div>
      <div><img src="logo-concept-ribbon.png" width="32"></div>
      <div><img src="logo-concept-ribbon.png" width="24"><br>24px</div>
      <div><img src="logo-concept-ribbon.png" width="16"><br>16px favicon</div>
    </div>
  </div>
  <div class="cand">
    <div class="tag"><b>B · S 折带六边形</b><span>logo-concept-sfold.png</span></div>
    <div class="row">
      <div class="cell light"><img src="logo-concept-sfold.png"></div>
      <div class="cell dark"><img src="logo-concept-sfold.png"></div>
    </div>
    <div class="sizes">
      <div><img src="logo-concept-sfold.png" width="64"></div>
      <div><img src="logo-concept-sfold.png" width="32"></div>
      <div><img src="logo-concept-sfold.png" width="24"><br>24px</div>
      <div><img src="logo-concept-sfold.png" width="16"><br>16px favicon</div>
    </div>
  </div>
</div>
<p class="note">重点检查：<b>小尺寸可辨识度</b>（16px 还能不能认出形体）、折叠带有没有扭曲粘连、星火是否正常、有无乱入文字或杂元素。选定后我会重新生成配套的深色版/头像版并更新品牌板。</p>
</body>
</html>
