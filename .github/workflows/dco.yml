name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Commit sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full pull request history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require author DCO sign-off on every commit
        run: >-
          node scripts/check-dco.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
