<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="L 廊：柱线去重与屋面交线"><title>L 廊：柱线去重与屋面交线</title><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#20333d}.title{font-size:26px;font-weight:700}.label{font-size:17px}.small{font-size:14px}.line{stroke:#3b5667;stroke-width:3;fill:none}.roof{stroke:#b45c39;stroke-width:3;fill:#f5e1d3}.part{stroke:#3b5667;stroke-width:2;fill:#dfebed}.post{stroke:#3b5667;stroke-width:2;fill:#e9bc86}.dash{stroke:#808d93;stroke-width:2;stroke-dasharray:7 5;fill:none}.seam{stroke:#bd6135;stroke-width:4;fill:none}</style><rect width="960" height="640" fill="#fbfaf5"/><text x="40" y="50" class="title">L 廊：柱线去重与屋面交线</text><text x="40" y="95" class="label">等宽、同标高、90° 两段；节点坐标去重，屋面在 45° 交线裁边</text><path d="M 80 420 H 700 V 145 H 500 V 220 H 80 Z" class="part"/><path d="M 60 440 H 720 V 125 H 480 V 200 H 60 Z" class="dash"/><line x1="80" y1="320" x2="600" y2="320" class="line"/><line x1="600" y1="320" x2="600" y2="145" class="line"/><line x1="500" y1="220" x2="700" y2="420" class="seam"/><circle cx="80" cy="220" r="8" class="post"/><circle cx="80" cy="420" r="8" class="post"/><circle cx="280" cy="220" r="8" class="post"/><circle cx="280" cy="420" r="8" class="post"/><circle cx="500" cy="220" r="8" class="post"/><circle cx="700" cy="420" r="8" class="post"/><circle cx="500" cy="145" r="8" class="post"/><circle cx="700" cy="145" r="8" class="post"/><text x="750" y="275" class="label">45° 接缝</text><text x="750" y="302" class="label">项目选定节点</text><text x="90" y="505" class="label">真实折线保留；不支持任意角度、错层或多路交汇</text><text x="90" y="545" class="label">各屋面板、檐椽、瓦面沿共享裁边域结束</text><text x="40" y="610" class="small">项目自绘工程示意 · mm · 无照片量测 / 历史或结构认证</text></svg>
