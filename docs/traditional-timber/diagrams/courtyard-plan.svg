t><text x="680" y="225" class="label">同一场地根包含：</text><text x="680" y="255" class="label">两段步道、一个花池</text><text x="680" y="310" class="label">修改：入口净宽</text><text x="680" y="340" class="label">1600 → 1900</text><text x="680" y="400" class="label">其余七根需指纹一致</text><text x="680" y="430" class="label">几何联系需原生核对</text></g><text x="40" y="610" class="small">项目自绘工程示意 · mm · 无照片量测 / 历史或结构认证</text></svg>
